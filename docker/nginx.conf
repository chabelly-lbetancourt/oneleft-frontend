# The OneLeft web app (a single-page application). In AWS it sits behind Caddy, which serves HTTPS and sends /api to
# the gateway and /auth to Keycloak on the same origin; this server only serves the files of the app.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (also on the error pages)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Health check of the container
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Files with a hash in their name (main-PN4UQWD6.js, media/…-AB12CD34.woff2) never change: cached for a year
    location ~* "[-.][0-9a-z_-]{8}\.(js|css|woff2?|ttf|eot|png|svg)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The service worker of the notices (HU-006), the translations and the page itself always come fresh, so a new
    # version of the app reaches everyone at once
    location ~ ^/(push-sw\.js|i18n/) {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Routes of the app (/plans/…, /profile…): any path that is not a file opens the app, which routes it
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        try_files $uri $uri/ /index.html;
    }
}

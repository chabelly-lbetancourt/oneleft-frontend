<header class="page-header">
  <div class="page-header__inner">
    <button
      type="button"
      class="back-link"
      [attr.aria-label]="'app.back' | transloco"
      (click)="back()"
    >
      <i class="pi pi-arrow-left" aria-hidden="true"></i>
    </button>
    <h1 class="page-header__title">{{ title() }}</h1>
    <ng-content />
  </div>
</header>

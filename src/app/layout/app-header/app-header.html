<header class="app-header">
  <div class="app-header__inner">
    <app-brand-logo />
    <div class="app-header__actions">
      @if (session.isAuthenticated()) {
        <button
          type="button"
          class="user-menu"
          aria-haspopup="menu"
          aria-controls="user-menu"
          [attr.aria-expanded]="menuOpen()"
          [attr.aria-label]="'userMenu.label' | transloco"
          (click)="menu.toggle($event)"
          (keydown.escape)="menu.hide()"
        >
          <app-person-avatar [name]="session.userName()" [photo]="myPhoto.url()" variant="user" />
          <span class="user-menu__name">{{ session.userName() }}</span>
          <i class="pi pi-angle-down user-menu__chevron" aria-hidden="true"></i>
        </button>
        <p-menu
          #menu
          id="user-menu"
          [model]="menuItems()"
          [popup]="true"
          appendTo="body"
          styleClass="user-menu-panel"
          (onShow)="menuOpen.set(true)"
          (onHide)="menuOpen.set(false)"
        />
      } @else {
        <app-theme-switcher />
        <app-language-switcher />
        <div class="app-header__access">
          <p-button
            [label]="'auth.register' | transloco"
            [text]="true"
            size="small"
            severity="secondary"
            routerLink="/register"
          />
          <p-button
            [label]="'auth.login' | transloco"
            icon="pi pi-user"
            size="small"
            [rounded]="true"
            routerLink="/login"
          />
        </div>
      }
    </div>
  </div>
</header>

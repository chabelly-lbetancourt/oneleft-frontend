<div class="card-skeleton__head">
  @if (media() === 'block') {
    <app-skeleton shape="block" width="3rem" height="3rem" />
  } @else if (media() === 'circle') {
    <app-skeleton shape="circle" width="4rem" height="4rem" />
  }
  <div class="card-skeleton__title">
    <app-skeleton width="55%" height="1.125rem" />
    @if (media() !== 'none') {
      <app-skeleton width="35%" />
    }
  </div>
</div>
@for (width of widths(); track $index) {
  <app-skeleton [width]="width" />
}

@for (person of people(); track $index) {
  <span
    [class]="'slot person-slot ' + person.tone"
    [class.person-slot--photo]="!!person.photo"
    [style.--i]="$index"
  >
    @if (person.photo; as photo) {
      <img class="person-slot__photo" [src]="photo" alt="" (error)="fail(photo)" />
    } @else {
      {{ person.initials }}
    }
  </span>
}
@for (free of freeSlots(); track $index) {
  <span class="slot free-slot" [style.--i]="people().length + $index">+</span>
}
@if (hiddenFree() > 0) {
  <span class="spot-slots__more">+{{ hiddenFree() }}</span>
}

name: ci

on:
  push:
    # issue#N and hotfix/* branches are validated in their pull request (avoids duplicate runs)
    branches: [main, pre, dev]
  pull_request:
    branches: [dev, pre, main]
    # labeled: adding the e2e label runs the end-to-end tests
    types: [opened, synchronize, reopened, labeled]
  # End-to-end tests by hand, against the backend images of an environment
  workflow_dispatch:
    inputs:
      image-tag:
        description: Tag of the backend images in GHCR (and branch of oneleft-infra)
        default: pre

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Lint, tests, coverage and build
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
      # pre (staging) pushes and PRs into pre use environment.pre.ts; everything else is a production build
      BUILD_CONFIGURATION: ${{ (github.ref == 'refs/heads/pre' || github.base_ref == 'pre') && 'pre' || 'production' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube needs the history to compute new code

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check the end-to-end tests
        run: npx tsc -p tsconfig.e2e.json

      - name: Tests and coverage (>= 80%)
        run: npm run test:ci

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage (Vitest)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/oneleft/lcov.info ]; then
            awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} /^BRF:/{bf+=$2} /^BRH:/{bh+=$2} /^FNF:/{ff+=$2} /^FNH:/{fh+=$2}
              END {printf "| Metric | Coverage |\n|---|---|\n| Lines | %.1f %% (%d/%d) |\n| Branches | %.1f %% (%d/%d) |\n| Functions | %.1f %% (%d/%d) |\n",
                   100*lh/lf, lh, lf, 100*bh/bf, bh, bf, 100*fh/ff, fh, ff}' coverage/oneleft/lcov.info >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build (${{ env.BUILD_CONFIGURATION }})
        run: |
          [ -n "$PRIMEUI_LICENSE" ] || echo "::notice::PRIMEUI_LICENSE is not set; the app will show the PrimeNG license notice."
          npm run build -- --configuration "$BUILD_CONFIGURATION"

      - name: Upload build and coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: |
            dist/oneleft/browser
            coverage/oneleft

      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

      - name: Notice when SonarQube Cloud is missing
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set; skipping the SonarQube Cloud analysis."

  # End-to-end tests (Playwright) against the whole stack: oneleft-infra Docker Compose with the backend images
  # published in GHCR and the development build of the app. For pull requests into pre, pull requests with the e2e
  # label and by hand.
  e2e:
    name: End-to-end tests (Playwright)
    if: >-
      github.base_ref == 'pre' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    env:
      PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
      ONELEFT_IMAGE_TAG: ${{ inputs.image-tag || 'pre' }}
    defaults:
      run:
        working-directory: oneleft-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: oneleft-frontend

      # Compose file, Keycloak realm (test users) and database scripts
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/oneleft-infra
          ref: ${{ env.ONELEFT_IMAGE_TAG }}
          path: oneleft-infra

      - uses: actions/setup-node@v7
        with:
          node-version-file: oneleft-frontend/.nvmrc
          cache: npm
          cache-dependency-path: oneleft-frontend/package-lock.json

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the stack (${{ env.ONELEFT_IMAGE_TAG }} images)
        run: |
          cp ../oneleft-infra/docker/.env.example ../oneleft-infra/docker/.env
          docker compose -f ../oneleft-infra/docker/compose.yaml -f e2e/compose.e2e.yaml --profile backend \
            up -d --no-build --pull always --wait --wait-timeout 600

      - name: Build the app (development configuration)
        run: npm run build -- --configuration development

      - name: End-to-end tests (es and en)
        run: npm run e2e

      - name: Service logs
        if: failure()
        run: docker compose -f ../oneleft-infra/docker/compose.yaml -f e2e/compose.e2e.yaml --profile backend logs --tail 200

      - name: Upload the report, screenshots, videos and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            oneleft-frontend/e2e-report
            oneleft-frontend/e2e-results
          retention-days: 14

  # Android app (Capacitor): the same Angular build packaged as a debug APK, uploaded as an artifact
  android:
    name: Android APK
    needs: build-test
    runs-on: ubuntu-24.04
    env:
      PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
      BUILD_CONFIGURATION: ${{ (github.ref == 'refs/heads/pre' || github.base_ref == 'pre') && 'pre' || 'production' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      # The build script passes the PrimeUI license (secret) to Angular
      - name: Web build (${{ env.BUILD_CONFIGURATION }})
        run: npm run build -- --configuration "$BUILD_CONFIGURATION"

      - name: Copy the build into the Android project
        run: npx cap sync android

      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: oneleft-android-${{ env.BUILD_CONFIGURATION }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Image of the web app: the Dockerfile builds the app (licence as a BuildKit secret) and nginx serves it. Built and
  # tried in every run; published from pre (staging, tag :pre) and main (production, tag :latest), like the backend.
  docker:
    name: Docker image · web
    needs: build-test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pre') }}
      BUILD_CONFIGURATION: ${{ (github.ref == 'refs/heads/pre' || github.base_ref == 'pre') && 'pre' || 'production' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/oneleft-web
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pre,enable=${{ github.ref == 'refs/heads/pre' }}

      - name: Build (${{ env.BUILD_CONFIGURATION }})
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          tags: oneleft/web:ci
          build-args: CONFIGURATION=${{ env.BUILD_CONFIGURATION }}
          secrets: primeui=${{ secrets.PRIMEUI_LICENSE }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Try the image (page, routes of the app, health and headers)
        run: |
          docker run -d --name web -p 8080:8080 oneleft/web:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q '<app-root'
          curl -fs http://localhost:8080/plans/any-plan | grep -q '<app-root'
          curl -fs http://localhost:8080/i18n/es.json > /dev/null
          curl -fsI http://localhost:8080/ | grep -qi 'x-content-type-options: nosniff'
          curl -fsI http://localhost:8080/push-sw.js | grep -qi 'cache-control: no-cache'
          docker rm -f web

      - name: Publish (pre and main)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CONFIGURATION=${{ env.BUILD_CONFIGURATION }}
          secrets: primeui=${{ secrets.PRIMEUI_LICENSE }}
          cache-from: type=gha,scope=web

  # Result of the CI in the project Slack channel, for pushes to dev/pre/main and for pull requests. The webhook URL
  # is a secret (SLACK_WEBHOOK_URL), never in the repository; without it the notification is skipped. Pull requests
  # from forks do not receive secrets, so they are skipped too.
  notify:
    name: Slack notification
    needs: [build-test, android, docker, e2e]
    if: always()
    runs-on: ubuntu-24.04
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
    steps:
      - name: Notify the project channel
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.event.head_commit.message }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          PUBLISHED: ''
        run: |
          case "$RESULT" in
            success) status=":white_check_mark: CI passed" ;;
            failure) status=":x: CI failed" ;;
            *) status=":warning: CI cancelled" ;;
          esac
          if [ "$RESULT" = success ] && [ -n "$PUBLISHED" ] && [ -z "$PR_NUMBER" ] && [ "$BRANCH" != dev ]; then
            status="$status · $PUBLISHED :$([ "$BRANCH" = main ] && echo latest || echo pre)"
          fi
          if [ -n "$PR_NUMBER" ]; then
            # Pull request: the ref is refs/pull/N/merge, so show the PR and its branch instead
            BRANCH="$PR_BRANCH → PR #$PR_NUMBER"
            COMMIT="$PR_TITLE"
          fi
          text=$(printf '%s *%s* · `%s`\n%s (%s)\n<%s|View run>' "$status" "$REPO" "$BRANCH" "${COMMIT%%$'\n'*}" "$ACTOR" "$RUN_URL")
          jq -n --arg text "$text" '{text: $text}' | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Notice when Slack is not configured
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "::notice::SLACK_WEBHOOK_URL is not set; skipping the Slack notification."
